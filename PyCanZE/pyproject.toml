[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycanze"
version = "0.1.0"
description = "Python tools for Renault vehicles based on CanZE"
authors = [{name = "CanZE contributors"}]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt",
]

[project.optional-dependencies]
wifi = ["python-OBD-wifi"]

[tool.setuptools.package-data]
"pycanze" = ["data/**/*.csv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pycanze*"]
